# wt as a herdr plugin.
#
# herdr owns terminal sessions and agents; wt owns worktrees, git state and
# Claude session discovery. They meet at two points, and this manifest is both
# of them.
#
# Install with `herdr plugin link <path-to-this-repo>` (or `herdr plugin
# install theczechr/wt` once published). Requires `wt` on PATH.

id = "theczechr.wt"
name = "wt"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Worktree and Claude-session dashboard, with bootstrap for herdr-created worktrees"
platforms = ["linux", "macos"]

# The dashboard, as a transient overlay: it opens zoomed over whatever pane is
# focused and restores that focus and zoom on exit, so checking worktree state
# never costs a layout change. wt paints its first frame from a snapshot in
# well under a second, which is what makes an overlay the right placement
# rather than a permanent split.
[[panes]]
id = "dashboard"
title = "Worktrees"
description = "Browse worktrees, sessions and processes across every configured repo"
placement = "overlay"
command = ["wt"]

# The integration that actually closes a gap.
#
# herdr creates worktrees itself -- worktree.create takes branch, base and
# path -- but has no bootstrap step of any kind: no post-create hook, no env
# handling, no submodule init. In a repo whose .env files are gitignored and
# whose build needs an initialised submodule, a herdr-made worktree cannot
# build. This hook hands the new worktree's path to the same bootstrap that
# `wt bootstrap` and `wt <branch>` use, so a worktree herdr creates is
# prepared identically to one made by hand.
#
# The hook exits 0 and explains itself for worktrees in repos wt does not
# manage -- it fires for every worktree herdr creates, most of which are not
# ours -- and exits non-zero only when the payload itself is broken.
[[events]]
on = "worktree.created"
command = ["wt", "hook", "herdr-worktree-created"]

# The dashboard again, as a bindable action.
#
# A [[panes]] entry declares an entrypoint but is not itself something a key
# can be bound to: herdr's `[[keys.command]]` takes `type = "plugin_action"`
# and a `<plugin_id>.<action_id>` target, and `herdr plugin action list`
# reports only [[actions]]. So the keyboard path to the dashboard is an action
# that opens the pane.
#
# It calls herdr back through $HERDR_BIN_PATH rather than a bare `herdr`.
# Herdr injects that variable into every runtime command precisely so plugins
# do not have to find the binary themselves, and it keeps this working when
# herdr is not on PATH.
#
# context = ["global"] because the dashboard is not scoped to the focused
# workspace, tab or pane -- it lists every worktree in every configured repo,
# which is the point of it.
[[actions]]
id = "open-dashboard"
title = "Worktrees"
description = "Open the wt dashboard as an overlay"
contexts = ["global"]
command = ["sh", "-c", '"$HERDR_BIN_PATH" plugin pane open --plugin theczechr.wt --entrypoint dashboard --placement overlay']

# Open the dashboard by itself when herdr starts -- the LazyVim landing
# screen, adapted to a multiplexer.
#
# The adaptation matters. LazyVim shows its dashboard whenever nvim opens
# without a file, because an editor starts empty. herdr does not: startup
# hooks run AFTER it restores the previous session, so it usually comes up
# with agents already working, and an overlay dropped across that on every
# start -- including every `herdr update --handoff`, which re-runs startup
# hooks -- would be noise.
#
# So the default is conditional: open the dashboard only when no agent is
# running, which is exactly when a launcher is what you wanted. Set
# herdr_startup_dashboard = "always" or "never" in wt's own config to
# override.
[[startup]]
command = ["wt", "hook", "herdr-startup"]

# Drop a removed worktree from wt's paint snapshot, so the next launch does
# not show a row for a directory that is gone.
#
# This is the verified half of the pair. herdr's worktree.removed payload is
# typed and schema-checked; Claude Code's own WorktreeRemove hook has a
# payload shape this project has never confirmed (see README), so the same
# subcommand accepts an argv path and CLAUDE_WORKTREE_PATH as well.
[[events]]
on = "worktree.removed"
command = ["wt", "hook", "worktree-removed"]
